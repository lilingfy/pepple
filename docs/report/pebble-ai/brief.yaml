report_type: "hybrid"
audience: "mixed"
title: "Pebble AI 项目架构与产品设计报告"
topic: "Pebble AI 项目架构与产品设计报告"
goal: "维护一份单一来源的中文 LaTeX 报告模板与正文工作区；先通过 brainstorming 讨论，再将确认后的结论写回正式报告。"
shared_references:
  decision_gates: "/Users/xyh/.agents/skills/report/_shared/references/decision-gates.md"
  executor_report_style: "/Users/xyh/.agents/skills/report/_shared/references/executor-report-style.md"
  anti_patterns: "/Users/xyh/.agents/skills/report/_shared/references/anti-patterns.md"
  progress_chapter_policy: "/Users/xyh/.agents/skills/report/_shared/references/progress-chapter-policy.md"
workflow_defaults:
  sequence:
    - "report-init: 生成固定半空模板，不预写长段正文"
    - "report-brainstorming: 讨论、检索、比较与定方向，不写入报告源"
    - "report-update: 将已确认结论写回，并做全局一致性扫面"
    - "report-audit: 做质量检查、修复排序与 readiness judgment"
    - "report-debate: 仅在命题有争议时做正反裁决"
  brainstorming_contract: "brainstorming 阶段默认只在对话中产出结论，不修改 docs/report/<slug>/"
  update_contract: "任何局部改写完成后，都需要检查摘要、定义、术语、图注、表格和相关章节是否仍然一致"
interaction_contract:
  policy: "持续交互；机械动作可自动执行，方向性选择必须先询问用户"
  must_ask_before:
    - "锁定报告类型、主叙事或主要受众"
    - "确定 brainstorming 的目标问题、目标章节或讨论边界"
    - "决定是否把现状事实扩散到 `项目进度` 之外的章节"
    - "决定章节是否需要拆分、重排或大改 framing"
    - "决定某项修改应走普通改写还是升级为 debate"
    - "为了消除 LaTeX warning 而显著改变表格布局、图表位置或结论强调"
writing_style_defaults:
  audience_model: "默认面向中文 rookie 读者：愿意认真阅读，但不预设其熟悉术语、背景或实现细节"
  tone: "正式中文书面语；保持学术严谨，同时像高质量技术博客一样易读、克制、信息密度高"
  section_opening: "每节开头尽快说明本节解决什么问题，以及读者读完后应获得什么判断"
  explanation_rule:
    - "首次出现的重要技术概念，至少解释：定义、动机、作用机制、在本文中的角色和边界"
    - "如果一个判断依赖前提、数据来源或设计假设，必须明确写出"
    - "优先直接陈述信息，再解释原因；避免靠修辞对照制造重点"
  preferred_patterns:
    - "直接定义对象、职责、问题和结论"
    - "短段落、高密度、强主题句"
    - "图表承担信息压缩，正文承担解释与边界"
    - "用 `本文`、`本报告`、`本节` 等正式写法组织论证"
  avoid_patterns:
    - "不是……而是……"
    - "并不是……而是……"
    - "真正重要的不是……"
    - "真正决定……的不是……"
    - "真正关注的不是……"
    - "真正的难点不在……"
    - "换句话说（若后文没有新增信息）"
    - "从某种意义上说"
    - "本质上（若后文没有新增定义、机制或边界）"
evidence_layers:
  - "source claim: 外部资料、论文、标准、官方文档明确说了什么"
  - "design intent: 本报告拟采用、拟建设、拟交付的目标态方案"
  - "repo-observed fact: 当前仓库、系统或实验产物真实已经显示了什么"
  - "report synthesis: 在以上证据基础上的综合判断、折中和建议"
repo_fact_policy:
  default_home: "项目进度"
  rule: "仓库现状、已完成里程碑、运行状态与当前阻塞默认集中写入 `项目进度`；其他章节只保留理解问题所需的最小现状事实"
must_include:
  - "执行摘要与阅读指南"
  - "一句话概述项目全景"
  - "背景、冲突、问题与回答"
  - "术语、概念或符号定义"
  - "至少一张总览图和一张关键流程图或对比表"
  - "项目进度"
  - "风险、局限、下一步与交付边界"
visual_defaults:
  framework_diagram: "Mermaid flowchart TB，按全景 -> 分层 -> 关键关系组织；先渲染成图再进 PDF"
  sequence_diagram: "Mermaid sequenceDiagram，按参与方 -> 请求/决策 -> 返回/反馈组织；先渲染成图再进 PDF"
  tikz_policy: "仅在布局精度、最终定稿或 Mermaid 无法清晰表达时使用 TikZ"
  table_style: "表格优先用于对比、定义、证据与检查清单；列名尽量问句化"
self_check_requirements:
  - "XeLaTeX 编译是否成功"
  - "Overfull / Underfull、float、表格宽度、引用、交叉引用等 warning 是否已分类"
  - "`项目进度` 是否存在且格式合规"
  - "低信息密度句式是否命中禁用规则"
  - "术语、缩写、图注、表头和摘要口径是否存在明显漂移"
  - "是否把 repo 当前状态无节制地写进了非 `项目进度` 章节"
consistency_sweep_requirements:
  - "检查核心概念首次定义是否仍然正确"
  - "检查摘要、章节标题、图注、表头和正文口径是否一致"
  - "检查术语、缩写和英文标识是否出现多种漂移写法"
  - "检查 design intent 与 repo-observed fact 是否被混写"
open_questions: []
repo_paths: []
web_research_queries: []
language_style: "正式中文书面语：学术严谨、易读、信息密度高，面向中文 rookie 读者"
compile_review_must_check:
  - "Overfull / Underfull box"
  - "表格过宽或分页异常"
  - "浮动体位置变化"
  - "未定义引用与 citation"
  - "目录、页眉、页脚与页码是否稳定"
