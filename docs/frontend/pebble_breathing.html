<!DOCTYPE html>

<html lang="zh-CN"><head>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Noto Serif SC and Noto Sans SC -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;family=Noto+Serif+SC:wght@400;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pebble-bg': '#F0F6F2',
            'pebble-rock': '#7D8C9F',
            'pebble-healing': '#A8D8B9',
            'pebble-green-soft': '#D1E7DD',
          },
          fontFamily: {
            'serif-sc': ['"Noto Serif SC"', 'serif'],
            'sans-sc': ['"Noto Sans SC"', 'sans-serif'],
          },
        }
      }
    }
  </script>
<style data-purpose="animations">/* Precise 4-7-8 Rhythm: Inhale 4s (21%), Hold 7s (37% more -> 58%), Exhale 8s (42% more -> 100%) */
    @keyframes breathing {
      0% { transform: scale(1); opacity: 0.8; }
      21% { transform: scale(1.5); opacity: 1; }
      58% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    @keyframes statusTextUpdate {
      0%, 20.9% { content: '吸气'; color: #115e59; }
      21%, 57.9% { content: '屏息'; color: #7D8C9F; }
      58%, 100% { content: '呼气'; color: #1e40af; }
    }

    @keyframes instructionTextUpdate {
      0%, 20.9% { content: 'DEEP INHALE (4S)'; }
      21%, 57.9% { content: 'HOLD GENTLY (7S)'; }
      58%, 100% { content: 'SLOW EXHALE (8S)'; }
    }

    .animate-breathing {
      animation: breathing 19s ease-in-out infinite;
    }

    .status-sync::after {
      content: '吸气';
      animation: statusTextUpdate 19s linear infinite;
    }

    .instruction-sync::after {
      content: 'DEEP INHALE (4S)';
      animation: instructionTextUpdate 19s linear infinite;
    }

    @keyframes ambientPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); filter: blur(80px); opacity: 0.4; }
      50% { transform: translate(-50%, -50%) scale(1.2); filter: blur(100px); opacity: 0.6; }
    }

    .animate-ambient {
      animation: ambientPulse 15s ease-in-out infinite;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    @keyframes etherealPulse {
      0%, 100% { opacity: 0.5; filter: blur(8px); transform: scale(1); }
      50% { opacity: 0.8; filter: blur(12px); transform: scale(1.02); }
    }

    .mist-diffusion {
      background: radial-gradient(circle, rgba(168, 216, 185, 0.15) 0%, transparent 70%);
      animation: etherealPulse 8s ease-in-out infinite;
    }</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet"/></head>
<body class="bg-pebble-bg font-sans-sc text-pebble-rock h-screen overflow-hidden select-none">

<!-- Navigation Menu -->

<a class="px-7 py-3 rounded-full text-base font-[700] tracking-widest text-[#2C3E50] bg-[#A8D8B9]/20 relative transition-all duration-300 font-bold" href="#">
    急救呼吸<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#A8D8B9] rounded-full animate-pulse"></span>

<!-- User Actions -->

<main class="relative z-10 h-[calc(100vh-88px)] flex flex-col items-center px-4 py-12 mt-[8vh] justify-center" data-purpose="emergency-breathing-module"><div class="text-center mb-8 mb-12" data-purpose="module-title">

      </p>
</div>
<div class="relative flex items-center justify-center mb-2 mt-12" data-purpose="breathing-interaction">
  <div class="absolute w-[400px] h-[400px] rounded-full bg-pebble-healing/10 blur-3xl"></div>
  <div class="absolute w-[300px] h-[300px] rounded-full bg-white/20 blur-2xl"></div>
  <div class="relative z-20 cursor-pointer group my-8" data-purpose="central-pebble" id="pebble-trigger">
    <div class="animate-breathing w-64 h-64 md:w-80 md:h-80 rounded-[45%_55%_60%_40%/_50%_45%_55%_50%] bg-gradient-to-br from-pebble-healing/60 via-pebble-healing/40 to-white/40 pebble-shadow flex flex-col items-center justify-center text-pebble-rock/80 transition-all duration-1000">
      <div class="text-center flex flex-col items-center justify-center">
        <span class="block font-serif-sc text-3xl font-bold mb-3 tracking-[0.3em] status-sync" id="breathing-status"></span>
        <span class="block text-[10px] uppercase tracking-widest opacity-60 instruction-sync" id="breathing-instruction"></span>
      </div>
    </div>
  </div>
</div>

<div class="text-center mb-8 relative group">
  <div class="absolute inset-0 mist-diffusion -z-10 scale-150"></div>
  <p class="font-serif-sc font-light text-xl text-[#7D8C9F]/80 tracking-[0.4em] px-12 py-2">
    请放空思绪，跟随律动呼吸
  </p>
</div>

<div class="flex flex-col items-center -mt-4" data-purpose="cooldown-inhibitor">
  <div class="glass-card rounded-full px-8 py-4 flex items-center space-x-6">
    <div class="flex items-center space-x-3">
      <div class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
      <span class="text-sm font-medium tracking-wide">建议平静时长:</span>
    </div>
    <div class="font-mono text-xl font-bold" id="timer">01:59</div>
  </div>
  
  <p class="mt-4 text-[11px] opacity-40 uppercase tracking-[0.2em]">Reactive reply inhibitor active</p>
</div>
</main>

<!-- BEGIN: Logic Scripts -->
<script data-purpose="breathing-logic">
    const timerElement = document.getElementById('timer');

    // Countdown Logic
    let timeLeft = 119; // 1:59
    const countdown = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(countdown);
        timerElement.innerText = "00:00";
        return;
      }
      timeLeft--;
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerElement.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }, 1000);
  </script>
<!-- END: Logic Scripts -->
</body></html>
